<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#071b43">
<title>Frostbite & F*ckery</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#061638;color:#fff;font-family:Arial,Helvetica,sans-serif}
body{overflow-x:hidden}.intro{min-height:100svh;display:flex;align-items:center;justify-content:center;text-align:center;padding:32px 22px;position:relative;isolation:isolate;background:radial-gradient(ellipse at 50% 35%,#173d79 0%,#0a2454 45%,#030d24 100%)}
.intro:before,.intro:after{content:"";position:absolute;inset:-20%;z-index:-1;background-image:radial-gradient(#fff 1px,transparent 1.5px),radial-gradient(#b9dfff 1px,transparent 1.5px);background-size:70px 70px,110px 110px;background-position:0 0,35px 45px;opacity:.25;animation:drift 18s linear infinite}
.intro:after{opacity:.13;background-position:20px 20px;animation-duration:28s}
@keyframes drift{to{transform:translateY(70px)}}
.inner{max-width:760px}.eyebrow{letter-spacing:.28em;font-size:12px;color:#b8d8ff;font-weight:700}.title{font-size:clamp(42px,9vw,88px);line-height:.94;letter-spacing:-.055em;font-weight:1000;text-transform:uppercase;margin:18px 0;text-shadow:0 5px 0 #06132d,0 10px 30px #0008}.subtitle{font-size:clamp(14px,2.5vw,20px);letter-spacing:.13em;font-weight:800;color:#dceaff;margin:22px 0 34px}.enter{border:2px solid #fff;background:#fff;color:#071b43;border-radius:3px;padding:17px 25px;font-size:14px;font-weight:900;letter-spacing:.12em;cursor:pointer;box-shadow:0 7px 0 #8bb5eb;transition:transform .15s,box-shadow .15s}.enter:active{transform:translateY(5px);box-shadow:0 2px 0 #8bb5eb}.hint{font-size:12px;color:#b6c9e8;margin-top:22px}
.reveal{display:none;min-height:100svh;background:#061638;position:relative}.reveal.show{display:block;animation:appear .9s ease both}@keyframes appear{from{opacity:0;transform:scale(1.025)}to{opacity:1;transform:scale(1)}}
.poster{display:block;width:100%;height:auto;max-height:100svh;object-fit:contain;margin:0 auto}
.audio-ui{position:fixed;z-index:5;right:12px;bottom:12px;background:#071b43dd;border:1px solid #ffffff66;border-radius:30px;padding:9px 13px;color:white;font-size:12px;display:none;backdrop-filter:blur(8px)}
.audio-ui button{background:none;border:0;color:white;font-weight:bold;font-size:13px}
.snow{pointer-events:none;position:fixed;inset:0;z-index:4;overflow:hidden;display:none}.snow.on{display:block}.flake{position:absolute;top:-15px;color:white;opacity:.8;animation:fall linear infinite;text-shadow:0 0 5px #fff}
@keyframes fall{to{transform:translate3d(35px,110vh,0) rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
<section class="intro" id="intro">
 <div class="inner">
  <div class="eyebrow">A CHRISTMAS SPECIAL</div>
  <h1 class="title">BEL &amp; CAIT<br>PRESENT</h1>
  <div class="title" style="font-size:clamp(36px,8vw,76px)">FROSTBITE<br>&amp; F*CKERY</div>
  <p class="subtitle">A FESTIVE FORECAST OF CHAOS, CARNAGE &amp; DEBAUCHERY</p>
  <button class="enter" id="enter">ENTER AT YOUR OWN RISK</button>
  <div class="hint">Sound on. Standards optional. ❄️</div>
 </div>
</section>
<section class="reveal" id="reveal" aria-label="Christmas weather forecast">
 <img class="poster" src="forecast.png" alt="BBC-style snowy UK weather forecast with the words Let It Snow">
</section>
</main>
<audio id="music" src="song.mp3" preload="auto" loop></audio>
<div class="audio-ui" id="audioUi"><button id="toggle">Ⅱ PAUSE MUSIC</button></div>
<div class="snow" id="snow"></div>
<script>
const enter=document.getElementById('enter'), music=document.getElementById('music'), reveal=document.getElementById('reveal'), intro=document.getElementById('intro'), snow=document.getElementById('snow'), ui=document.getElementById('audioUi'), toggle=document.getElementById('toggle');
function makeSnow(){for(let i=0;i<42;i++){const f=document.createElement('span');f.className='flake';f.textContent=Math.random()>.45?'❄':'·';f.style.left=Math.random()*100+'%';f.style.fontSize=(10+Math.random()*17)+'px';f.style.animationDuration=(7+Math.random()*12)+'s';f.style.animationDelay=(-Math.random()*18)+'s';snow.appendChild(f)}}
makeSnow();
enter.addEventListener('click',async()=>{intro.style.display='none';reveal.classList.add('show');snow.classList.add('on');ui.style.display='block';try{await music.play();toggle.textContent='Ⅱ PAUSE MUSIC'}catch(e){toggle.textContent='▶ PLAY MUSIC'}});
toggle.addEventListener('click',async()=>{if(music.paused){try{await music.play();toggle.textContent='Ⅱ PAUSE MUSIC'}catch(e){}}else{music.pause();toggle.textContent='▶ PLAY MUSIC'}});
</script>
</body></html>
